[project]
name = "rokujo-aligner"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "sentence-transformers>=5.6.0",
    "ja-ginza>=5.2.0",
    "spacy>=3.8.11,<3.8.14",
    "rich>=15.0",
    "numpy>=2.4.0",
    "typer>=0.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.0",
]

[project.scripts]
rokujo-aligner = "rokujo.aligner.cli:main"

[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-v --tb=short"
disable_test_id_escaping_and_forfeit_all_rights_to_community_support = true
